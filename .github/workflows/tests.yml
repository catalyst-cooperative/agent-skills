name: tests

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

jobs:
  test-datapackage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          frozen: true

      - name: Run datapackage tests
        run: pixi run test-datapackage

  test-pudl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          frozen: true

      - name: Run pudl tests
        run: pixi run test-pudl

  check-datapackage-catalog-urls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          frozen: true

      - name: Check datapackage catalog URL availability
        run: pixi run python dev/tools/check_datapackage_catalog_urls.py
